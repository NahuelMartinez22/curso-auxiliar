<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Curso Auxiliar 2026 · Estudio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: columna central de lectura; tablero de unidades en grilla; cada pregunta es una "planilla" de polígono. */
:root {
  --bg: #edf1f5;
  --surface: #fafbfc;
  --surface-2: #e2e8ef;
  --ink: #0f1d2b;
  --muted: #526273;
  --line: #c9d3de;
  --accent: #946510;
  --accent-ink: #ffffff;
  --accent-soft: #f2e5c5;
  --band: #0e2a47;
  --band-2: #143a60;
  --band-ink: #eef3f8;
  --band-muted: #a9bdd1;
  --ok: #1b7348;
  --ok-soft: #d8eee2;
  --bad: #b1261f;
  --bad-soft: #f7dedb;
  --warn: #985300;
  --warn-soft: #f6e6cd;
  --anchor: #4369b0;
  --plate: #ffffff;
  --plate-ink: #13212e;
  --plate-line: #22313f;
  --shadow: 0 1px 2px rgba(15, 29, 43, .06), 0 6px 18px rgba(15, 29, 43, .07);
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #09121c; --surface: #101b28; --surface-2: #192737; --ink: #e5ecf3; --muted: #93a5b7; --line: #253547;
    --accent: #e0ae4a; --accent-ink: #1a1408; --accent-soft: #3a2f17;
    --band: #0b1f35; --band-2: #10304f; --band-ink: #eef3f8; --band-muted: #a3b8cc;
    --ok: #63c58f; --ok-soft: #14301f; --bad: #f08077; --bad-soft: #3a1c19; --warn: #e9a752; --warn-soft: #382914;
    --plate: #f3f5f7; --plate-ink: #13212e; --plate-line: #22313f; --anchor: #8aaee8;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #09121c; --surface: #101b28; --surface-2: #192737; --ink: #e5ecf3; --muted: #93a5b7; --line: #253547;
  --accent: #e0ae4a; --accent-ink: #1a1408; --accent-soft: #3a2f17;
  --band: #0b1f35; --band-2: #10304f; --band-ink: #eef3f8; --band-muted: #a3b8cc;
  --ok: #63c58f; --ok-soft: #14301f; --bad: #f08077; --bad-soft: #3a1c19; --warn: #e9a752; --warn-soft: #382914;
  --plate: #f3f5f7; --plate-ink: #13212e; --plate-line: #22313f; --anchor: #8aaee8;
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.3);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 16px; line-height: 1.5;
}
img, svg { max-width: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.wrap {
  max-width: 940px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- Encabezado ---------- */
.band { background: linear-gradient(180deg, var(--band) 0%, var(--band-2) 100%); color: var(--band-ink); position: relative; }
.waves { display: block; width: 100%; height: 34px; margin-top: -1px; }
.waves .w1 { fill: var(--band-2); }
.waves .w2 { fill: var(--bg); }
.band .wrap { padding-block: 36px 22px; display: grid; gap: 14px; }
.eyebrow {
  font-family: var(--f-mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--band-muted); display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 14px; }
.brand svg { flex: none; width: 60px; height: 60px; color: #a9c4f2; }
h1 {
  font-family: var(--f-display); font-weight: 700; font-size: clamp(34px, 6vw, 52px);
  line-height: 1; letter-spacing: .01em; margin: 0; text-transform: uppercase; text-wrap: balance;
}
h1.long { font-size: clamp(30px, 5vw, 46px); }
.subj {
  justify-self: start; display: inline-grid; grid-auto-flow: column; gap: 4px; padding: 4px;
  border: 1px solid rgba(238,240,232,.28); border-radius: 999px; background: rgba(0,0,0,.16); max-width: 100%;
}
.subj button {
  border: 0; background: transparent; color: var(--band-muted); border-radius: 999px; padding: 8px 16px;
  font-family: var(--f-mono); font-size: 12.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap;
}
.subj button:hover { color: var(--band-ink); }
.subj button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
@media (max-width: 420px) { .subj button { padding: 8px 11px; font-size: 11.5px; letter-spacing: .03em; } }
.lead { max-width: 64ch; margin: 0; color: var(--band-muted); font-size: 17px; }
.lead b { color: var(--band-ink); font-weight: 600; }

.types { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.types span {
  font-family: var(--f-mono); font-size: 12px; letter-spacing: .04em;
  border: 1px solid rgba(238,240,232,.28); border-radius: 999px; padding: 4px 10px; color: var(--band-ink);
}

/* ---------- Tablero ---------- */
main.home .wrap { padding-block: 28px 48px; display: grid; gap: 28px; }
.sec-title {
  font-family: var(--f-display); font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
  font-size: 22px; margin: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px;
}
.sec-title small { font-family: var(--f-mono); font-size: 12px; color: var(--muted); letter-spacing: .06em; font-weight: 500; text-transform: none; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.ucard {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  padding: 18px; display: grid; grid-template-rows: auto auto 1fr auto; gap: 8px; min-width: 0;
}
.ucard .num { font-family: var(--f-mono); font-size: 12px; color: var(--accent); letter-spacing: .1em; font-weight: 600; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.ucard .num svg { width: 34px; height: 34px; flex: none; color: var(--anchor); }
.ucard h3 { font-family: var(--f-display); font-size: 26px; line-height: 1.05; margin: 0; text-transform: uppercase; letter-spacing: .01em; text-wrap: balance; }
.ucard p { margin: 0; color: var(--muted); font-size: 15px; }
.ucard .foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
.meta { font-family: var(--f-mono); font-size: 12px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.best { color: var(--ink); }
.best.pass { color: var(--ok); }
.best.fail { color: var(--bad); }

.final {
  background: var(--surface); border: 2px solid var(--accent); border-radius: var(--r);
  padding: 22px; display: grid; grid-template-columns: auto 1fr auto; gap: 20px; align-items: center;
}
.final > svg { width: 88px; height: 88px; color: var(--anchor); }
.final h3 { font-family: var(--f-display); font-size: 30px; margin: 0 0 4px; text-transform: uppercase; line-height: 1; }
.final p { margin: 0; color: var(--muted); }
.final .actions { display: grid; gap: 10px; justify-items: end; }
.check { display: inline-flex; gap: 8px; align-items: center; font-size: 15px; cursor: pointer; user-select: none; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }
@media (max-width: 640px) {
  .final { grid-template-columns: 1fr; }
  .final > svg { display: none; }
  .final .actions { justify-items: stretch; }
}
.figbtns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 640px) { .figbtns { grid-template-columns: 1fr; } }
.figbtn {
  display: grid; grid-template-columns: 104px 1fr; gap: 14px; align-items: center; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; min-width: 0;
}
.figbtn:hover { border-color: var(--accent); }
.figbtn .th { width: 104px; height: 84px; background: var(--plate); border-radius: 6px; overflow: hidden; display: grid; place-items: center; border: 1px solid var(--line); }
.figbtn .th svg { width: 100%; height: 100%; display: block; }
.figbtn .tx { display: grid; gap: 4px; min-width: 0; }
.figbtn b { font-family: var(--f-display); font-size: 21px; text-transform: uppercase; line-height: 1.05; letter-spacing: .01em; }
.figbtn small { color: var(--muted); font-size: 14px; line-height: 1.35; }
.figbtn .go { font-family: var(--f-mono); font-size: 12px; color: var(--accent); font-weight: 600; letter-spacing: .04em; }
.lg { list-style: none; margin: 0; padding: 12px 14px; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px 16px; background: var(--surface-2); border-radius: 8px; font-weight: 600; }
.lg li { display: flex; gap: 10px; align-items: center; min-width: 0; }
.lg .n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-mono); background: #c99634; color: #1c2521; flex: none; font-size: 13px; }
.note { color: var(--muted); font-size: 14px; margin: 0; max-width: 70ch; }

/* ---------- Botones ---------- */
.btn {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 8px; padding: 10px 16px; font-weight: 600; font-size: 15px; line-height: 1.2;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px;
}
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }

/* ---------- Barra de la quiz ---------- */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--band); }
.qbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--band); color: var(--band-ink); }
.qbar .wrap { padding-block: 10px; display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: center; }
.qbar .ttl { font-family: var(--f-display); font-size: 20px; text-transform: uppercase; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.qbar .ttl small { font-family: var(--f-mono); font-size: 12px; color: var(--band-muted); text-transform: none; letter-spacing: .04em; margin-left: 6px; }
.clock { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 15px; display: inline-flex; gap: 6px; align-items: center; padding: 4px 10px; border-radius: 6px; background: rgba(255,255,255,.08); }
.clock.low { background: var(--bad); color: #fff; }
.qbar .btn { min-height: 36px; padding: 6px 12px; background: transparent; color: var(--band-ink); border-color: rgba(238,240,232,.35); }
.qbar .btn.warn { background: var(--bad); border-color: var(--bad); color: #fff; }
.prog { height: 4px; background: rgba(255,255,255,.12); }
.prog i { display: block; height: 100%; background: var(--accent); transition: width .25s ease; }

main.quiz .wrap { padding-block: 22px 56px; }
#app.wide .wrap { max-width: 1320px; }
.lwrap { display: grid; gap: 16px; }
.lfig { display: grid; gap: 12px; min-width: 0; }
@media (min-width: 1000px) {
  .lwrap { grid-template-columns: minmax(0, 1.75fr) minmax(280px, 1fr); grid-template-areas: "fig modes" "fig rows"; grid-template-rows: auto 1fr; align-items: start; column-gap: 20px; row-gap: 12px; }
  .lwrap .lfig { grid-area: fig; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 74px); }
  .lwrap .modes { grid-area: modes; width: 100%; }
  .lwrap .modes button { font-size: 20px; min-height: 50px; padding: 10px 8px; }
  .lwrap .lrows { grid-area: rows; grid-template-columns: 1fr; gap: 6px; align-content: start; }
  .lwrap .lrow select, .lwrap .lrow .lin { min-height: 40px; padding-block: 6px; }
  .lwrap .plate svg { max-height: max(360px, calc(100vh - 230px)); }
  .lwrap.many { grid-template-columns: minmax(0, 1.45fr) minmax(400px, 1fr); }
  .lwrap.many .lrows { grid-template-columns: 1fr 1fr; column-gap: 10px; }
  .lwrap.many .lrow { grid-template-columns: 30px 1fr; gap: 6px; }
  .lwrap.many .lrow .n { width: 28px; height: 28px; font-size: 13px; }
}
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.qhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 20px; border-bottom: 1px dashed var(--line); flex-wrap: wrap; }
.qnum { font-family: var(--f-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chip { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.qbody { padding: 20px; display: grid; gap: 18px; }
.qtext { font-size: clamp(19px, 2.6vw, 22px); line-height: 1.35; font-weight: 600; margin: 0; text-wrap: pretty; }
.hint { color: var(--muted); font-size: 14px; margin: -8px 0 0; }

/* opción múltiple */
.opts { display: grid; gap: 10px; }
.opt {
  display: grid; grid-template-columns: 32px 1fr; gap: 12px; align-items: center; text-align: left;
  border: 1.5px solid var(--line); background: var(--surface); border-radius: 8px; padding: 12px 14px; min-height: 52px;
}
.opt .k { width: 30px; height: 30px; border-radius: 6px; display: grid; place-items: center; font-family: var(--f-mono); font-weight: 600; font-size: 14px; background: var(--surface-2); }
.opt:hover:not(:disabled) { border-color: var(--ink); }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.opt[aria-pressed="true"] .k { background: var(--accent); color: var(--accent-ink); }
.opt.ok { border-color: var(--ok); background: var(--ok-soft); }
.opt.ok .k { background: var(--ok); color: #fff; }
.opt.bad { border-color: var(--bad); background: var(--bad-soft); }
.opt.bad .k { background: var(--bad); color: #fff; }
.opt:disabled { cursor: default; }
.tf { grid-template-columns: 1fr 1fr; }
.tf .opt { grid-template-columns: 1fr; text-align: center; font-weight: 700; font-size: 17px; justify-items: center; }

/* completar */
.fill { font-size: 18px; line-height: 2.25; margin: 0; }
.fill .ln { display: block; }
.fill .ln + .ln { margin-top: 6px; }
.blank-w { display: inline-flex; flex-direction: column; vertical-align: baseline; }
.blank {
  border: 0; border-bottom: 2px solid var(--accent); background: var(--accent-soft); border-radius: 4px 4px 0 0;
  padding: 2px 8px; font-size: 17px; font-weight: 600; width: 10ch; line-height: 1.5; min-width: 0;
}
.blank.wide { width: 14ch; }
.blank:focus { outline: none; background: var(--surface-2); border-bottom-color: var(--ink); }
.blank.ok { border-bottom-color: var(--ok); background: var(--ok-soft); }
.blank.bad { border-bottom-color: var(--bad); background: var(--bad-soft); text-decoration: line-through; text-decoration-thickness: 1.5px; }
.fix { font-family: var(--f-mono); font-size: 12.5px; line-height: 1.3; font-weight: 600; padding: 2px 2px 0; }
.fix.bad { color: var(--bad); }
.fix.ok { color: var(--ok); }

/* ordenar */
.olist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.oitem {
  display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; padding: 8px 8px 8px 10px; min-height: 52px;
  touch-action: pan-y;
}
.oitem .pos { width: 30px; height: 30px; border-radius: 6px; display: grid; place-items: center; font-family: var(--f-mono); font-weight: 600; background: var(--surface-2); font-variant-numeric: tabular-nums; }
.oitem .txt { min-width: 0; }
.oitem .txt small { display: block; font-family: var(--f-mono); font-size: 12px; font-weight: 600; }
.oitem .tools { display: flex; gap: 4px; align-items: center; }
.oitem .tools button { width: 36px; height: 36px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface-2); display: grid; place-items: center; padding: 0; }
.oitem .tools button:disabled { opacity: .35; cursor: default; }
.oitem .handle { cursor: grab; touch-action: none; color: var(--muted); }
.oitem.dragging { position: relative; z-index: 3; box-shadow: var(--shadow); border-color: var(--accent); cursor: grabbing; }
.olist.locked .tools { display: none; }
.oitem.ok { border-color: var(--ok); background: var(--ok-soft); }
.oitem.ok .pos { background: var(--ok); color: #fff; }
.oitem.bad { border-color: var(--bad); background: var(--bad-soft); }
.oitem.bad .pos { background: var(--bad); color: #fff; }
.oitem.bad small { color: var(--bad); }

/* figuras */
.plate { background: var(--plate); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.plate svg { display: block; width: 100%; height: auto; max-height: 640px; }
.plate .lead-l { stroke: var(--plate-line); stroke-width: 1.6; }
.plate .lead-h { stroke: var(--plate); stroke-width: 5; stroke-linecap: round; }
.plate .tdot { fill: var(--plate-ink); stroke: var(--plate); stroke-width: 2; }
.plate .mk circle { fill: #c99634; stroke: var(--plate-ink); stroke-width: 2; }
.plate .mk text { fill: var(--plate-ink); font-family: var(--f-mono); font-weight: 600; font-size: 16px; text-anchor: middle; dominant-baseline: central; }
.plate .mk.ok circle { fill: #2f9a5f; }
.plate .mk.bad circle { fill: #c8372d; }
.plate .mk.ok text, .plate .mk.bad text { fill: #fff; }
.plate .mk.hl circle { stroke-width: 4; }
.lrows { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px 14px; }
.lrow { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; }
.lrow .n { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-mono); font-weight: 600; background: #c99634; color: #1c2521; margin-top: 6px; }
.lrow.ok .n { background: var(--ok); color: #fff; }
.lrow.bad .n { background: var(--bad); color: #fff; }
.lrow select { width: 100%; min-width: 0; min-height: 42px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); padding: 8px 10px; }
.lrow.ok select { border-color: var(--ok); background: var(--ok-soft); }
.rts { display: grid; gap: 14px; }
.rt { display: grid; gap: 6px; padding: 12px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); }
.rt label { display: flex; gap: 10px; align-items: center; font-size: 18px; }
.rt label .n { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-mono); font-weight: 600; background: #c99634; color: #1c2521; flex: none; font-size: 14px; }
.rt textarea { width: 100%; min-width: 0; resize: vertical; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); padding: 10px 12px; font-size: 17px; line-height: 1.45; font-weight: 500; }
.rt textarea:focus { outline: none; border-color: var(--accent); background: var(--accent-soft); }
.rt.ok { border-color: var(--ok); background: var(--ok-soft); }
.rt.part { border-color: var(--warn); background: var(--warn-soft); }
.rt.bad { border-color: var(--bad); background: var(--bad-soft); }
.rtres { margin: 0; font-size: 16px; line-height: 1.55; }
mark.miss { background: transparent; color: var(--bad); font-weight: 700; text-decoration: underline; text-decoration-thickness: 2px; }
.lrow .lin { width: 100%; min-width: 0; min-height: 42px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); padding: 8px 10px; font-weight: 600; }
.lrow .lin:focus { outline: none; border-color: var(--accent); background: var(--accent-soft); }
.lrow.ok .lin { border-color: var(--ok); background: var(--ok-soft); }
.lrow.bad .lin { border-color: var(--bad); background: var(--bad-soft); text-decoration: line-through; }
.ex { margin: 12px 0 2px; padding: 10px 14px 12px; border-left: 4px solid var(--accent); border-radius: 0 8px 8px 0; background: var(--surface); }
.ex .exl { display: block; font-family: var(--f-mono); font-size: 11.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-bottom: 2px; }
.ex p { margin: 0; color: var(--ink); }
.fb .ex { margin: 2px 0; }
.ex.ex-sm { margin-top: 8px; padding: 8px 12px 10px; font-size: 14.5px; background: var(--surface-2); }
.modes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; padding: 6px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; width: min(100%, 480px); }
.modes button { border: 0; background: transparent; border-radius: 8px; padding: 12px 18px; font-family: var(--f-display); font-weight: 700; font-size: 22px; letter-spacing: .03em; text-transform: uppercase; min-height: 56px; color: var(--muted); }
.modes button:hover { color: var(--ink); }
.modes button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); box-shadow: var(--shadow); }
@media (max-width: 560px) { .modes button { font-size: 19px; padding: 10px 6px; min-height: 52px; } }
.lrow.bad select { border-color: var(--bad); background: var(--bad-soft); }

/* devolución */
.fb { border-top: 1px solid var(--line); padding: 18px 20px; display: grid; gap: 10px; background: var(--surface-2); }
.fb.ok { border-top: 4px solid var(--ok); }
.fb.bad { border-top: 4px solid var(--bad); }
.fb.part { border-top: 4px solid var(--warn); }
.verdict { font-family: var(--f-display); font-size: 24px; text-transform: uppercase; letter-spacing: .02em; display: flex; gap: 10px; align-items: center; margin: 0; line-height: 1; }
.fb.ok .verdict { color: var(--ok); }
.fb.bad .verdict { color: var(--bad); }
.fb.part .verdict { color: var(--warn); }
.fb p { margin: 0; max-width: 72ch; }
.fb .right { font-weight: 600; }
.fb .src { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.fb ol { margin: 0; padding-left: 22px; }
.qactions { padding: 14px 20px 18px; display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; border-top: 1px solid var(--line); }
.kbd { font-family: var(--f-mono); font-size: 12px; color: var(--muted); margin-right: auto; align-self: center; }
@media (max-width: 560px) { .kbd { display: none; } .qbody, .qhead, .fb, .qactions { padding-left: 14px; padding-right: 14px; } }

/* ---------- Resultados ---------- */
main.res .wrap { padding-block: 28px 56px; display: grid; gap: 22px; }
.score { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 22px; display: grid; grid-template-columns: 170px 1fr; gap: 22px; align-items: center; box-shadow: var(--shadow); }
.score svg { width: 170px; height: 170px; }
.score h2 { font-family: var(--f-display); font-size: 34px; text-transform: uppercase; margin: 0; line-height: 1; }
.score .stamp { display: inline-block; font-family: var(--f-display); font-size: 22px; letter-spacing: .08em; text-transform: uppercase; border: 3px solid currentColor; padding: 2px 12px; border-radius: 6px; transform: rotate(-3deg); margin: 10px 0; }
.stamp.pass { color: var(--ok); }
.stamp.fail { color: var(--bad); }
.stats { display: flex; gap: 10px; flex-wrap: wrap; font-family: var(--f-mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.stats span { background: var(--surface-2); border-radius: 6px; padding: 4px 10px; }
.stats .o { color: var(--ok); } .stats .p { color: var(--warn); } .stats .x { color: var(--bad); }
.timeout { color: var(--bad); font-weight: 600; margin: 6px 0 0; }
@media (max-width: 600px) { .score { grid-template-columns: 1fr; justify-items: center; text-align: center; } .stats { justify-content: center; } }
.racts { display: flex; gap: 10px; flex-wrap: wrap; }

.tbl-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); }
th { font-family: var(--f-mono); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
td.n { font-family: var(--f-mono); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
.bar { display: block; height: 6px; border-radius: 3px; background: var(--surface-2); min-width: 80px; }
.bar i { display: block; height: 100%; border-radius: 3px; }

.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tabs button { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 999px; font-weight: 600; font-size: 14px; min-height: 40px; }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.review { display: grid; gap: 10px; }
.ritem { background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--ok); border-radius: 8px; padding: 14px 16px; display: grid; gap: 8px; min-width: 0; }
.ritem.bad { border-left-color: var(--bad); }
.ritem.part { border-left-color: var(--warn); }
.ritem .top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.ritem .top .qnum { margin-right: auto; }
.ritem h4 { margin: 0; font-size: 16px; line-height: 1.4; }
.ritem .ans { display: grid; gap: 4px; font-size: 15px; }
.ritem .ans div { min-width: 0; overflow-wrap: anywhere; }
.lbl { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-right: 6px; }
.ritem .why { color: var(--muted); font-size: 14.5px; margin: 0; }
.wrongtxt { color: var(--bad); }
.righttxt { color: var(--ok); font-weight: 600; }
.empty { color: var(--muted); padding: 10px 0; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- Menú de materias ---------- */
.mgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 680px) { .mgrid { grid-template-columns: 1fr; } }
@media (max-width: 480px) { .mcard { padding: 14px; column-gap: 12px; } .mcard .mi { width: 52px; height: 52px; border-radius: 10px; } .mcard .mi svg { width: 38px; height: 38px; } .mcard b { font-size: 20px; } }
.mcard {
  display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: auto auto; column-gap: 16px; row-gap: 8px; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; color: var(--ink); text-decoration: none; min-width: 0;
}
a.mcard:hover { border-color: var(--accent); }
.mcard .mi { grid-row: 1 / span 2; width: 72px; height: 72px; display: grid; place-items: center; border-radius: 12px; background: var(--surface-2); color: var(--anchor); }
.mcard .mi svg { width: 52px; height: 52px; }
.mcard .mt { display: grid; gap: 4px; min-width: 0; }
.mcard b { font-family: var(--f-display); font-size: 24px; text-transform: uppercase; line-height: 1.05; letter-spacing: .01em; text-wrap: balance; }
.mcard small { color: var(--muted); font-family: var(--f-mono); font-size: 12px; }
.mcard .go { font-family: var(--f-mono); font-size: 12.5px; color: var(--accent); font-weight: 600; letter-spacing: .04em; }
.mcard.soon { border-style: dashed; background: transparent; }
.mcard.soon .mi { opacity: .55; }
.mcard.soon b { color: var(--muted); }
.mcard.soon .go { color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.back {
  justify-self: start; color: var(--band-ink); text-decoration: none; font-family: var(--f-mono); font-size: 12.5px; font-weight: 600;
  letter-spacing: .06em; text-transform: uppercase; border: 1px solid rgba(238,240,232,.28); border-radius: 999px; padding: 8px 14px; background: rgba(0,0,0,.16);
}
.back:hover { border-color: var(--accent); }
.plate.insig { padding: 16px; display: grid; place-items: center; margin-bottom: 14px; }
.plate.insig img { width: min(100%, 380px); height: auto; display: block; }
.figbtn .th img { width: 100%; height: 100%; object-fit: contain; display: block; padding: 6px; }
</style>

    { t: "mc", q: "¿Qué significa gradualidad en el uso de la fuerza?",

    { t: "tf", q: "La fuga aislada de una persona, sin peligro para la vida de nadie, habilita por sí sola el disparo.", a: false,

    { t: "mc", q: "¿Cuándo puede omitirse la advertencia verbal (identificarse e intimar a viva voz)?",

    { t: "mc", q: "¿Qué es una agresión ilegítima?",

    { t: "tf", q: "Identificar a una persona equivale a detenerla.", a: false,

    { t: "mc", q: "¿Cuándo comienza la privación de libertad?",

    { t: "mc", q: "¿Cuál de estas preguntas verifica que la persona comprendió sus derechos, sin interrogarla sobre el hecho?",

    { t: "mc", q: "¿Cuál es la diferencia entre palpado preventivo y requisa?",

      src: "Agravante por integrar una fuerza · arts. 163 bis y 167 bis CP" },
    { t: "mc", q: "¿Qué abarca el art. 79 del Código Penal?",
      o: ["Solo el homicidio simple: hay agravantes, atenuadas y formas culposas aparte", "Todas las muertes delictivas posibles, sean dolosas, culposas o agravadas", "Solo las muertes causadas en siniestros viales con vehículos con motor", "Solo las muertes causadas por integrantes de las fuerzas de seguridad"],
      exp: "El art. 79 regula el homicidio simple (reclusión o prisión de 8 a 25 años). Existen agravantes (art. 80), figuras atenuadas y formas culposas (arts. 84 y 84 bis).",
      ex: "Matar a alguien con intención, sin ninguna circunstancia especial, es el art. 79; si la víctima es un agente atacado por su función, se va al art. 80.",

    { t: "tf", q: "El «peligro para la vida» de las lesiones graves se presume siempre que el ataque fue violento.", a: false,

      ex: "Una persona recibe varios golpes violentos, pero no se constata que su vida haya estado en peligro: no se puede afirmar ese supuesto solo por lo violento del ataque.",
      src: "Lesiones · art. 90 CP" },
    { t: "tf", q: "En las lesiones gravísimas no siempre hace falta la pérdida anatómica de un órgano o miembro: también cuenta la pérdida de su uso.", a: true,
      exp: "Correcto (art. 91 CP). Por eso hay que describir con precisión la secuela.",
      ex: "Si por una agresión una persona conserva la mano pero ya no puede usarla, también se analiza como pérdida del uso de un miembro.",
      src: "Lesiones · art. 91 CP" },
    { t: "mc", q: "¿Qué circunstancia agrava la privación ilegítima de la libertad (art. 142 CP), según el material?",
      o: ["Que haya violencias o amenazas o se simule autoridad pública", "Que la persona privada de libertad sea mayor de edad y capaz", "Que el encierro se produzca de día y dentro de un lugar público", "Que la persona logre escaparse sola al poco tiempo de ser encerrada"],

      ex: "Alguien se hace pasar por policía para encerrar a una persona en un auto: es una privación de libertad agravada por simular autoridad pública.",
      src: "Privación ilegítima de la libertad · art. 142 CP" },
    { t: "tf", q: "Para que haya tortura (art. 144 ter), el funcionario tiene que tener formalmente a la víctima a su cargo.", a: false,

    { t: "tf", q: "El art. 144 ter también prevé la responsabilidad de particulares que ejecuten los hechos de tortura.", a: true,

      ex: "Un particular que participa con funcionarios en someter a un detenido a sufrimientos graves también puede responder por tortura.",
      src: "Tortura · art. 144 ter CP" },
    { t: "mc", q: "En el hurto y el robo, ¿qué significa «apoderarse»?",
      o: ["Poner la cosa bajo el propio poder, desplazando el de quien la tenía", "Tocar la cosa ajena aunque se la deje en el mismo lugar donde estaba", "Pedir prestada la cosa con permiso de su dueño durante un tiempo corto", "Dañar la cosa ajena sin moverla del lugar en el que se encontraba"],

      src: "Hurto y robo · arts. 162 y 164 CP" },
    { t: "tf", q: "La «fuerza en las cosas» del robo es cualquier esfuerzo físico necesario para mover un objeto pesado.", a: false,

  ]
},
{
  id: "r4c", num: 4, label: "Unidad 4 · Clase 3", short: "U4 · C3",
  title: "Función pública, autoridad y flagrancia",
  topics: "Atentado, resistencia, cohecho, abuso de autoridad, deberes del funcionario, orden constitucional, flagrancia y casos",
  questions: [
    { t: "mc", q: "¿Qué protegen los delitos contra la Administración Pública?",
      o: ["El funcionamiento regular, legal e imparcial del Estado", "La propiedad privada de los funcionarios y sus familias", "La seguridad exterior, la independencia y la defensa de la Nación", "La vida y la integridad física de las personas"],
      exp: "Tienen especial importancia para quienes ejercen funciones públicas: atentado, resistencia, abuso de autoridad, violación de deberes y cohecho, entre otros.",
      ex: "Que un funcionario acepte dinero para no labrar un acta afecta el funcionamiento legal e imparcial del Estado.",
      src: "Delitos contra la Administración Pública" },
    { t: "mc", q: "¿Qué es el atentado contra la autoridad (art. 237 CP)?",
      o: ["Usar intimidación o fuerza contra un funcionario para exigirle un acto de su función", "Oponerse a la orden legítima de un funcionario o no cumplirla después de recibirla", "Ofrecerle dinero a un funcionario para que omita un acto que le corresponde hacer", "Que un funcionario dicte o ejecute órdenes contrarias a la Constitución o a las leyes"],
      exp: "Atentado (art. 237): se le exige al funcionario hacer u omitir un acto de su función. Oponerse a una orden legítima es resistencia (art. 239); ofrecer dinero es ofrecimiento de dádivas (art. 258); dictar órdenes contrarias a la ley es abuso de autoridad (art. 248).",
      ex: "Durante un procedimiento legítimo, una persona amenaza al funcionario para obligarlo a suspender la actuación.",
      src: "Atentado y resistencia · art. 237 CP" },
    { t: "mc", q: "¿Cuál es la expresión clave de la resistencia o desobediencia a la autoridad (art. 239 CP)?",
      o: ["Ejercicio legítimo de sus funciones", "Empleo de intimidación o de fuerza física", "Acto propio de su oficio", "Dinero u otra dádiva"],
      exp: "Primero se analiza si la actuación del Estado era legal; después, la conducta de la persona.",
      ex: "Un agente da una orden legal dentro de un procedimiento y la persona se resiste. Primero se analiza si la orden era legítima.",
      src: "Atentado y resistencia · art. 239 CP" },
    { t: "mc", q: "¿En qué se diferencian el atentado y la resistencia a la autoridad?",
      o: ["En el atentado se impone al funcionario algo que no decidió; en la resistencia se opone a una orden ya dada", "En el atentado se opone a una orden ya dada; en la resistencia se impone al funcionario algo que no decidió", "En el atentado nunca hay violencia física; en la resistencia siempre se usa un arma de fuego", "No se diferencian en nada: son dos nombres distintos para la misma figura del Código Penal"],
      exp: "Atentado (art. 237): exigir al funcionario que haga o deje de hacer. Resistencia (art. 239): oponerse a una orden legítima ya dada.",
      ex: "Atentado: alguien amenaza al agente para que no labre un acta. Resistencia: el agente ya ordenó algo legal y la persona se opone a cumplirlo.",
      src: "Atentado y resistencia · arts. 237 y 239 CP" },
    { t: "tf", q: "Preguntar «¿por qué me piden el documento?» configura por sí solo resistencia a la autoridad.", a: false,
      exp: "Falso. Preguntar el motivo de una intervención no es delito. No se debe agregar una agresión, amenaza o negativa que no existió.",
      ex: "Un agente pide el documento y la persona pregunta por qué: eso no es resistir. Preguntar no es delito.",
      src: "Atentado y resistencia · art. 239 CP" },
    { t: "tf", q: "El art. 239 no puede usarse para castigar el ejercicio del derecho a guardar silencio o a pedir un defensor.", a: true,
      exp: "Correcto. La investidura del funcionario no vuelve válida cualquier exigencia.",
      ex: "Si una persona aprehendida dice «quiero hablar con mi abogado y no voy a declarar», eso no es desobediencia.",
      src: "Atentado y resistencia · art. 239 CP" },
    { t: "mc", q: "Durante un procedimiento legítimo, alguien amenaza con un arma al funcionario para que suspenda la actuación. ¿Qué se analiza además del atentado simple?",
      o: ["El art. 238, que agrava ciertos supuestos de atentado", "El abuso de autoridad del funcionario (art. 248)", "La violación de los deberes del funcionario (art. 249)", "El cohecho pasivo del funcionario (art. 256)"],
      exp: "El ejemplo del arma obliga a examinar también el art. 238, que agrava determinados supuestos de atentado. La calificación exige conocer la secuencia y la finalidad.",
      ex: "Si la persona solo discute a los gritos con el agente, sin intimidarlo ni usar fuerza, no se dan todos los elementos del atentado.",
      src: "Atentado y resistencia · art. 238 CP" },
    { t: "mc", q: "¿Qué es el cohecho pasivo (art. 256 CP)?",
      o: ["El funcionario que recibe una dádiva o acepta una promesa por un acto de su función", "Ofrecer o entregar dinero u otra dádiva a un funcionario para que omita un acto", "El funcionario que dicta resoluciones u órdenes contrarias a la Constitución o las leyes", "El funcionario que omite, rehúsa o demora ilegalmente un acto propio de su oficio"],
      exp: "Art. 256: el funcionario que recibe dinero u otra dádiva, o acepta una promesa, para hacer, retardar o dejar de hacer algo de su función. El art. 258 contempla a quien ofrece o entrega la dádiva.",
      ex: "Durante un procedimiento, alguien le dice al funcionario «quedate con esto y hacé de cuenta que no viste nada», y el funcionario acepta.",
      src: "Cohecho · arts. 256 y 258 CP" },
    { t: "tf", q: "Si el funcionario rechaza el dinero ofrecido, quien lo ofreció ya no puede responder penalmente.", a: false,
      exp: "Falso. La conducta de quien ofrece se analiza por separado (art. 258): el rechazo no elimina su posible delito. Hay que registrarlo y comunicarlo.",
      ex: "Un comerciante le ofrece dinero a un agente para que no labre un acta y el agente se niega: el comerciante igual puede responder por el ofrecimiento.",
      src: "Cohecho · art. 258 CP" },
    { t: "tf", q: "Para el cohecho pasivo no hace falta recibir el dinero: también está prevista la aceptación de una promesa.", a: true,
      exp: "Correcto (art. 256 CP). Por eso, si solo se informó un ofrecimiento aceptado, no hay que agregar que hubo entrega material.",
      ex: "«Si mañana no labrás el acta, te doy plata», y el funcionario dice que sí: aunque todavía no recibió nada, aceptó la promesa.",
      src: "Cohecho · art. 256 CP" },
    { t: "tf", q: "Lo central del cohecho es el vínculo entre la ventaja y un acto de la función, no el valor de lo entregado.", a: true,
      exp: "Correcto. Una suma pequeña no elimina por sí sola el delito.",
      ex: "Aceptar una suma chica para «hacer la vista gorda» en un control sigue siendo cohecho: lo que importa es que se vende un acto de la función.",
      src: "Cohecho · art. 256 CP" },
    { t: "mc", q: "¿Qué diferencia al abuso de autoridad (art. 248) del cohecho?",
      o: ["El abuso de autoridad no necesita un intercambio de dinero", "El abuso de autoridad solo puede cometerlo un particular", "El abuso de autoridad exige siempre una víctima lesionada", "El abuso de autoridad es una falta disciplinaria, no un delito"],
      exp: "Abuso de autoridad: dictar o ejecutar órdenes contrarias a la Constitución o las leyes, o no ejecutar las que corresponde. Puede no haber dinero de por medio.",
      ex: "Un funcionario que sabe que una medida está prohibida y, aprovechando su autoridad, ordena ejecutarla, puede cometer abuso de autoridad aunque nadie le haya pagado nada.",
      src: "Abuso de autoridad · art. 248 CP" },
    { t: "tf", q: "Una orden puede ser irregular sin que, por ese solo dato, esté probado el delito de abuso de autoridad.", a: true,

      ex: "Una orden con un error de forma no es por eso abuso de autoridad: hay que ver, entre otras cosas, si el funcionario sabía que era contraria a la ley.",
      src: "Abuso de autoridad · art. 248 CP" },
    { t: "mc", q: "¿Cuáles son las tres formas de incumplimiento de la violación de deberes (art. 249 CP)?",
      o: ["Omitir, rehusar o retardar un acto propio del oficio", "Dictar, ejecutar o no ejecutar órdenes ilegales", "Recibir, aceptar u ofrecer dinero, una dádiva o una promesa", "Resistir, desobedecer o estorbar a un funcionario"],
      exp: "Art. 249: el funcionario que ilegalmente omite, rehúsa hacer o retarda un acto propio de su oficio. Hay que identificar qué actuación le correspondía al cargo.",
      ex: "Un funcionario tiene la obligación legal de hacer una actuación y deliberadamente se niega, no la hace o la demora sin causa.",
      src: "Violación de deberes · art. 249 CP" },
    { t: "tf", q: "Toda demora en un trámite o error administrativo constituye el delito de violación de deberes.", a: false,

      ex: "Un trámite que se demoró porque el sistema no funcionaba no es por eso un delito: hay que probar una obligación concreta y un incumplimiento ilegal.",
      src: "Violación de deberes · art. 249 CP" },
    { t: "mc", q: "Un jefe o agente de la fuerza pública se niega sin causa a prestar el auxilio que le pide legalmente una autoridad civil competente. ¿Qué figura es?",
      o: ["Negativa de auxilio (art. 250)", "Atentado contra la autoridad (art. 237)", "Resistencia o desobediencia (art. 239)", "Cohecho pasivo (art. 256)"],
      exp: "El art. 250 se refiere a la negativa, omisión o demora injustificada en prestar el auxilio legalmente requerido por una autoridad civil competente.",
      ex: "Distinto es que la demora tenga una causa justificada; el art. 250 habla de una negativa, omisión o demora injustificada.",
      src: "Violación de deberes · art. 250 CP" },
    { t: "mc", q: "Un grupo armado pretende deponer por la fuerza a las autoridades constitucionales. ¿Qué grupo de delitos se afecta?",
      o: ["Contra el orden constitucional (arts. 226 a 236)", "Contra la seguridad pública (arts. 186 a 208)", "Contra la Administración Pública (arts. 237 y ss.)", "Contra la propiedad (arts. 162 y siguientes)"],
      exp: "El alzamiento en armas (art. 226) compromete el orden institucional, no solo a una persona. Son tres títulos distintos: seguridad pública (186-208), seguridad de la Nación (214-225) y orden constitucional (226-236).",
      ex: "Una marcha, una crítica política o una petición, en cambio, no son un alzamiento en armas.",
      src: "Orden constitucional y seguridad del Estado" },
    { t: "mc", q: "Provocar intencionalmente un incendio que pone en riesgo a muchas personas afecta principalmente…",

      exp: "Los delitos contra la seguridad pública (arts. 186 a 208 CP) protegen a la comunidad frente a peligros que alcanzan a un número indeterminado de personas o bienes.",

      src: "Orden constitucional y seguridad del Estado" },
    { t: "mc", q: "¿En qué grupo de delitos está la traición?",
      o: ["Contra la seguridad de la Nación", "Contra la seguridad pública", "Contra la Administración Pública", "Contra los poderes públicos"],

    { t: "tf", q: "La crítica política, el desacuerdo o una petición equivalen por sí solos a un alzamiento en armas.", a: false,

    { t: "mc", q: "¿Qué es la flagrancia?",
      o: ["La conexión inmediata entre una persona y un delito reciente o en curso", "Un delito adicional que se suma al hecho principal cuando hay persecución", "Una sospecha basada en la experiencia del agente y en la zona del hecho", "Una declaración de culpabilidad que se dicta en el momento del hecho"],
      exp: "Hay flagrancia cuando la persona intenta cometer el delito, lo comete o acaba de cometerlo. Está en el art. 285 CPPN y en el art. 217 CPPF; la aprehensión sin orden, en el art. 216 CPPF.",
      ex: "Se escucha romperse una ventanilla y se ve a una persona sacando una mochila del auto: hay una conexión inmediata con el hecho.",
      src: "Flagrancia · CPPN art. 285 · CPPF art. 217" },
    { t: "mc", q: "¿Cuál de estos supuestos NO es flagrancia?",
      o: ["Ver a alguien que hace días pudo cometer un delito", "Sorprenderlo justo mientras intenta cometer el delito", "Perseguirlo inmediatamente después del hecho", "Hallarlo con rastros de que acaba de participar"],
      exp: "Los cuatro supuestos típicos: intentando, cometiendo, inmediatamente después y perseguido, o con objetos o rastros que muestren que acaba de participar. Tener algo que alguna vez pudo provenir de un delito no alcanza.",
      ex: "Encontrar hoy a alguien con un celular que tal vez fue robado la semana pasada no es flagrancia: falta la inmediatez.",
      src: "Flagrancia · CPPN art. 285 · CPPF art. 217" },
    { t: "tf", q: "Decir «me pareció sospechoso porque caminaba mirando autos» demuestra por sí solo una situación de flagrancia.", a: false,
      exp: "Falso. Una impresión no es flagrancia: tiene que haber circunstancias objetivas que vinculen enseguida a la persona con el hecho.",
      ex: "En cambio, ver a alguien forzar la cerradura de un auto para llevárselo sí es un dato objetivo de flagrancia.",
      src: "Flagrancia no es una sospecha genérica" },
    { t: "mc", q: "¿Cuál de estas situaciones presenta datos objetivos de flagrancia?",
      o: ["Se oye romper una ventanilla y se ve a alguien sacar una mochila del auto", "Una persona camina de madrugada mirando los autos estacionados en la calle", "Una persona se pone nerviosa y cambia de vereda al ver pasar el móvil policial", "Una persona viste ropa parecida a la de una descripción genérica recibida"],
      exp: "La diferencia está en los hechos descriptos, no en la confianza que el agente tenga en su intuición.",
      ex: "La víctima grita que le acaban de robar el teléfono y el autor es perseguido enseguida, sin perderlo de vista.",
      src: "Flagrancia no es una sospecha genérica" },
    { t: "tf", q: "Que no haya flagrancia significa que nunca puede haber una detención sin orden.", a: false,
      exp: "Falso. El CPPN contempla otros supuestos (art. 284) y el CPPF incluye, por ejemplo, la fuga de un lugar de detención (art. 216). Pero no se reemplazan con una sospecha genérica.",
      ex: "Según el material, el CPPF también prevé aprehender sin orden a quien se fuga de un lugar de detención.",
      src: "Flagrancia no es una sospecha genérica" },
    { t: "mc", q: "En el CPPN, ¿cuándo debe presentarse al detenido ante la autoridad judicial?",
      o: ["De inmediato, con un máximo de seis horas", "Dentro de las 24 horas, prorrogables por 24", "Dentro de las 72 horas, en todos los casos", "Cuando termine la investigación preventiva"],
      exp: "Art. 286 CPPN: de inmediato, como máximo en 6 horas; ese máximo no autoriza a demorar si puede hacerse antes. En el CPPF, en flagrancia, la audiencia inicial es dentro de 24 horas (art. 329). No se mezclan plazos.",
      ex: "Si se aprehende a alguien a las 10:00 y se lo puede presentar a las 11:00, hay que hacerlo a esa hora: el máximo de seis horas no autoriza a demorar.",
      src: "Aprehensión en flagrancia · CPPN art. 286" },
    { t: "tf", q: "La flagrancia permite actuaciones inmediatas, pero no elimina el debido proceso ni la presunción de inocencia.", a: true,
      exp: "Correcto. La persona aprehendida se pone de inmediato a disposición de la autoridad, con todas sus garantías.",
      ex: "Una persona aprehendida en flagrancia se pone enseguida a disposición de la autoridad, con sus derechos, y sigue siendo jurídicamente inocente.",
      src: "Aprehensión en flagrancia · CPPF art. 216" },
    { t: "mc", q: "Caso: un hombre sale corriendo de un comercio, el comerciante grita «¡me robó!» y los agentes lo persiguen y lo aprehenden a pocos metros con el teléfono. ¿Qué conclusión es correcta?",
      o: ["Puede analizarse flagrancia, pero falta saber si fue hurto o robo", "Hay robo seguro, porque el comerciante usó la palabra «robó»", "No hay flagrancia, porque nadie vio el momento exacto de la sustracción", "Hay flagrancia y el aprehendido ya es culpable del robo"],
      exp: "Hay inmediatez, persecución y un vínculo objetivo. Pero el enunciado no describe fuerza ni violencia: no se puede afirmar el robo (art. 164) en lugar del hurto (art. 162). Y la aprehensión no lo vuelve culpable.",
      ex: "Si el comerciante contara que el hombre lo empujó para sacarle el teléfono, ahí sí habría un dato de violencia para analizar el robo.",
      src: "Caso 1 · Robo y flagrancia" },
    { t: "tf", q: "En ese mismo caso, los agentes pueden golpear al aprehendido para que diga dónde están otros objetos.", a: false,

      ex: "Si el aprehendido se niega a decir dónde están otros objetos, se registra su silencio y se sigue el procedimiento: nunca se lo golpea.",
      src: "Caso 1 · Robo y flagrancia" },
    { t: "tf", q: "En ese caso, el teléfono hallado debe individualizarse, preservarse y ponerse a disposición según las reglas de secuestro y cadena de custodia.", a: true,
      exp: "Correcto. El secuestro no autoriza a quedárselo ni a revisar su información (CPPF arts. 156 y 157).",
      ex: "El teléfono se describe (marca, color, estado), se embala, se rotula y se registra quién lo tuvo; los agentes no se lo quedan ni revisan su contenido.",
      src: "Caso 1 · Robo y flagrancia" },

function boreArt() {
  const cx = 310, cy = 230, rl = 95, rg = 112, ro = 175;
  const pts = [];
  for (let d = 0; d < 360; d += 1) {
    const rel = ((d % 60) + 60) % 60;              /* macizos centrados en 0°, 60°, 120°… */
    const r = (rel <= 15 || rel >= 45) ? rl : rg;
    const a = d * Math.PI / 180;
    pts.push(`${(cx + r * Math.cos(a)).toFixed(1)},${(cy + r * Math.sin(a)).toFixed(1)}`);
  }
  return `
  <defs>
    <pattern id="steel" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="9" height="9" fill="#c4c9cc"/><line x1="0" y1="0" x2="0" y2="9" stroke="#6c7478" stroke-width="1.5"/>
    </pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c2521"/>
    </marker>
  </defs>
  <circle cx="${cx}" cy="${cy}" r="${ro}" fill="url(#steel)" stroke="#2a3530" stroke-width="2.5"/>
  <polygon points="${pts.join(" ")}" fill="#fbfbf8" stroke="#2a3530" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="${cx - rl + 3}" y1="${cy}" x2="${cx + rl - 3}" y2="${cy}" stroke="#1c2521" stroke-width="2.2" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <line x1="${cx}" y1="${cy - rg + 3}" x2="${cx}" y2="${cy + rg - 3}" stroke="#1c2521" stroke-width="2.2" stroke-dasharray="7 4" marker-start="url(#ar)" marker-end="url(#ar)"/>`;
}

/* Figura completa con marcadores numerados. opts.names: muestra el nombre de cada parte. opts.status: {n: 'ok'|'bad'} */
function figSVG(key, opts = {}) {
  const F = FIGS[key];
  let art = "";
  if (key === "beretta") {
    const p = F.photo;
    art = `<image href="${IMG[p.key]}" x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}"/>`;
  } else if (key === "cartucho") art = `<g transform="matrix(0,-1,1,0,60,700)">${cartridgeArt()}</g>
    <text x="250" y="26" font-family="IBM Plex Mono, monospace" font-size="13" fill="#56625b" text-anchor="end">CORTE</text>
    <text x="270" y="26" font-family="IBM Plex Mono, monospace" font-size="13" fill="#56625b">EXTERIOR</text>`;
  else if (key === "anima") art = boreArt();
  let leads = "", marks = "";
  const k = opts.k || 1;
  for (const t of F.targets) {
    leads += `<line class="lead-h" x1="${t.tx}" y1="${t.ty}" x2="${t.lx}" y2="${t.ly}" style="stroke-width:${5 * k}"/>`;
    leads += `<line class="lead-l" x1="${t.tx}" y1="${t.ty}" x2="${t.lx}" y2="${t.ly}" style="stroke-width:${1.6 * k}"/>`;
    leads += `<circle class="tdot" cx="${t.tx}" cy="${t.ty}" r="${4.5 * k}"/>`;
    const st = opts.status && opts.status[t.n] ? " " + opts.status[t.n] : "";
    marks += `<g class="mk${st}" data-n="${t.n}"><circle cx="${t.lx}" cy="${t.ly}" r="${16 * k}"/><text x="${t.lx}" y="${t.ly + 1}" style="font-size:${16 * k}px">${t.n}</text></g>`;
    if (opts.names) {
      const right = t.lx > F.w / 2;
      const tx = right ? t.lx + 24 : t.lx - 24;
      marks += `<text x="${tx}" y="${t.ly + 1}" font-family="Barlow, system-ui, sans-serif" font-weight="700" font-size="19" fill="#1c2521" stroke="#ffffff" stroke-width="5" paint-order="stroke" dominant-baseline="central" text-anchor="${right ? "start" : "end"}">${esc(t.name)}</text>`;
    }
  }
  const pad = opts.names ? (F.namePad || 0) : 0;
  return `<svg viewBox="${-pad} 0 ${F.w + 2 * pad} ${F.h}" role="img" aria-label="Figura con partes numeradas"><rect x="${-pad}" width="${F.w + 2 * pad}" height="${F.h}" fill="var(--plate, #fff)"/>${art}${leads}${marks}</svg>`;
}

/* Escala de marcadores para que sigan legibles cuando la figura se achica (celular). */
function markScale(svgW, boxW) { return Math.max(1, Math.min(2.2, (svgW / Math.max(boxW || svgW, 1)) * 0.75)); }

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function norm(s) {
  return String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase()
    .replace(/×/g, "x").replace(/,/g, ".").replace(/[\s\-–]+/g, "").replace(/\.+$/, "");
}
function fmtTime(ms) { const s = Math.max(0, Math.round(ms / 1000)); const m = Math.floor(s / 60); return `${String(m).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; }
function fmtNum(n) { return (Math.round(n * 10) / 10).toLocaleString("es-AR"); }
function unitOf(id) { return ALL_UNITS.find(u => u.id === id); }

};
function parseFill(text) {

function startQuiz(kind, payload) {
  let qs, title, sub, limit = 0, id;
  if (kind === "unit") SUBJ = Object.values(SUBJECTS).find(x => x.units.some(u => u.id === payload)) || SUBJ;
  if (kind === "deck") SUBJ = Object.values(SUBJECTS).find(x => (x.quick || []).some(c => c.deck === payload.id)) || SUBJ;
  if (kind === "fig" || kind === "rules") SUBJ = SUBJECTS.tya;
  if (kind === "unit") {
    const u = unitOf(payload); id = u.id; title = u.title; sub = u.label;
    qs = shuffle(u.questions);
  } else if (kind === "final") {
    const US = SUBJ.units;
    id = SUBJ.finalId; title = "Examen final"; sub = "Integrador · " + SUBJ.name; limit = payload.timed ? FINAL_MIN * 60000 : 0;
    const quotas = US.map(() => Math.floor(FINAL_N / US.length));
    let rest = FINAL_N - quotas.reduce((a, b) => a + b, 0);
    shuffle(US.map((_, i) => i)).slice(0, rest).forEach(i => quotas[i]++);
    qs = shuffle(US.flatMap((u, i) => shuffle(u.questions).slice(0, quotas[i])));
  } else if (kind === "deck") {
    const D = DECKS[payload.id];
    id = "deck-" + payload.id; title = D.title; sub = D.sub[payload.mode] || "Repaso";
    qs = buildDeck(payload.id, payload.mode);
  } else if (kind === "rules") {
    id = "rules"; title = "Reglas de oro"; sub = "Repaso";
    qs = [rulesMode === "write" ? buildRulesTextQuestion() : buildRulesQuestion()];
  } else if (kind === "fig") {
    const f = FIG_PRACTICE.find(x => x.key === payload);
    id = "fig-" + f.key; title = f.title; sub = "Repaso de imagen";
    qs = [UNITS.flatMap(u => u.questions).find(q => q.t === "label" && q.fig === f.key)];
  } else {
    id = payload.id; title = payload.title; sub = "Repaso de errores";
    qs = shuffle(payload.qs);
  }
  S = { kind, subj: SUBJ ? SUBJ.id : null, figKey: kind === "fig" ? payload : null, deck: kind === "deck" ? payload : null, id, title, sub, views: qs.map(q => prepare(q, kind)), i: 0, res: [], t0: Date.now(), limit, done: false, timeout: false, checked: false };

}

function tick() {
  if (!S || S.done) return;
  const el = $("#clock"); if (!el) return;
  const el2 = Date.now() - S.t0;
  if (S.limit) {
    const left = S.limit - el2;
    el.querySelector("span").textContent = fmtTime(left);
    el.classList.toggle("low", left < 5 * 60000);
    el.title = "Tiempo restante";
    if (left <= 0) { S.timeout = true; finish(); }
  } else {
    el.querySelector("span").textContent = fmtTime(el2);
    el.title = "Tiempo transcurrido";
  }
}
