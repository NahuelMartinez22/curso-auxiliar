/* ---------- Quiz ---------- */
function renderQuiz() {
  const n = S.views.length;
  app().innerHTML = `
  <div class="qbar"><div class="wrap">
    <div class="ttl">${esc(S.title)}<small>${esc(S.sub)}</small></div>
    <div class="clock" id="clock"><svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 4.5V8l2.5 1.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span>00:00</span></div>
    <button class="btn" id="quit">Salir</button>
  </div><div class="prog"><i id="progbar" style="width:0%"></i></div></div>
  <main class="quiz"><div class="wrap" id="qwrap"></div></main>`;
  const quit = $("#quit");
  quit.onclick = () => {
    if (quit.dataset.arm) { renderHome(); return; }
    quit.dataset.arm = "1"; quit.textContent = "¿Salir? Se pierde el avance"; quit.classList.add("warn");
    setTimeout(() => { if (quit.isConnected) { delete quit.dataset.arm; quit.textContent = "Salir"; quit.classList.remove("warn"); } }, 3500);
  };
  renderQuestion();
}

function renderQuestion() {
  const v = S.views[S.i], q = v.q, n = S.views.length;
  S.checked = false;
  $("#progbar").style.width = `${(S.i / n) * 100}%`;
  const u = unitOf(q.uid);
  let body = "", hint = "";
  if (q.t === "mc") {
    const fig = q.fig === "right" ? `<div class="plate" id="figr"></div>` : q.img ? `<div class="plate insig"><img src="${q.img}" alt="Insignia a identificar"></div>` : "";
    body = fig + `<div class="opts" role="group" aria-label="Opciones">${v.perm.map((k, j) =>
      `<button class="opt" data-k="${k}" aria-pressed="false" id="opt-${j}"><span class="k">${"ABCD"[j]}</span><span>${esc(q.o[k])}</span></button>`).join("")}</div>`;
  } else if (q.t === "tf") {
    body = `<div class="opts tf" role="group" aria-label="Verdadero o falso">
      <button class="opt" data-v="1" aria-pressed="false" id="opt-v">Verdadero</button>
      <button class="opt" data-v="0" aria-pressed="false" id="opt-f">Falso</button></div>`;
  } else if (q.t === "fill") {
    hint = "Escribí la palabra que falta en cada espacio. Se acepta sin tildes ni mayúsculas.";
    const lines = [[]];
    v.parsed.segs.forEach(s => {
      if (s.text != null) {
        const pieces = s.text.split("\n");
        pieces.forEach((p, i) => { if (i > 0) lines.push([]); if (p) lines[lines.length - 1].push(esc(p)); });
      } else {
        const ans = v.parsed.blanks[s.blank][0];
        lines[lines.length - 1].push(`<span class="blank-w"><input class="blank${ans.length > 9 ? " wide" : ""}" id="b-${S.i}-${s.blank}" data-b="${s.blank}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Espacio ${s.blank + 1}"></span>`);
      }
    });
    body = `<p class="fill">${lines.map(l => `<span class="ln">${l.join("")}</span>`).join("")}</p>`;
  } else if (q.t === "order") {
    hint = "Arrastrá desde ⠿ o usá las flechas. Cuenta como correcta solo si el orden completo es correcto.";
    body = `<ol class="olist" id="olist">${v.arr.map(k => orderItem(q, k)).join("")}</ol>`;
  } else if (q.t === "rtext") {
    hint = "Escribí cada regla completa. Te damos solo la primera palabra. No cuentan las tildes, las mayúsculas ni la puntuación.";
    body = `<div class="rts">${q.rules.map((r, i) => {
      const first = r.split(" ")[0];
      return `<div class="rt" data-i="${i}"><label for="rt-${S.i}-${i}"><span class="n">${i + 1}</span><b>${esc(first)}…</b></label>
        <textarea id="rt-${S.i}-${i}" rows="2" placeholder="Escribí la regla completa…" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea></div>`;
    }).join("")}</div>`;
  } else if (q.t === "label") {
    const write = v.mode === "write";
    hint = write ? "Escribí el nombre de cada parte. Se acepta sin tildes ni mayúsculas." : "Elegí el nombre que corresponde a cada número. Hay nombres de más que no van.";
    const F = FIGS[q.fig];
    const names = [...F.targets.map(t => t.name), ...F.extra].sort((a, b) => a.localeCompare(b, "es"));
    const legend = S.kind === "fig" ? `<ol class="lg" id="legend" hidden>${F.targets.slice().sort((a, b) => a.n - b.n).map(t => `<li><span class="n">${t.n}</span>${esc(t.name)}</li>`).join("")}</ol>` : "";
    const modes = S.kind === "fig" ? `<div class="modes" role="group" aria-label="Dificultad">
        <button type="button" data-mode="select" aria-pressed="${!write}">Seleccionar</button>
        <button type="button" data-mode="write" aria-pressed="${write}">Escribir</button></div>` : "";
    body = `<div class="lwrap${F.targets.length > 8 ? " many" : ""}">${modes}<div class="lfig"><div class="plate" id="fig"></div>${legend}</div>
      <div class="lrows">${F.targets.slice().sort((a, b) => a.n - b.n).map(t => `
        <div class="lrow" data-n="${t.n}"><span class="n">${t.n}</span><div style="display:grid;gap:2px;min-width:0">
          ${write
            ? `<input class="lin" id="sel-${S.i}-${t.n}" aria-label="Nombre de la parte número ${t.n}" placeholder="Escribí el nombre…" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">`
            : `<select id="sel-${S.i}-${t.n}" aria-label="Parte número ${t.n}"><option value="">Elegí…</option>${names.map(nm => `<option>${esc(nm)}</option>`).join("")}</select>`}
        </div></div>`).join("")}</div></div>`;
  }
  app().classList.toggle("wide", q.t === "label");
  if (S.kind === "rules") body = `<div class="modes" role="group" aria-label="Modo">
      <button type="button" data-rmode="fill" aria-pressed="${q.t === "fill"}">Completar</button>
      <button type="button" data-rmode="write" aria-pressed="${q.t === "rtext"}">Escribir</button></div>` + body;
  $("#qwrap").innerHTML = `
  <article class="qcard">
    <div class="qhead"><span class="qnum">Pregunta ${S.i + 1} de ${n}</span><span class="chip">${TYPE_LABEL[q.t]}</span></div>
    <div class="qbody">
      <h2 class="qtext">${esc(q.q)}</h2>
      ${hint ? `<p class="hint">${hint}</p>` : ""}
      ${body}
    </div>
    <div class="fb" id="fb" hidden></div>
    <div class="qactions">${S.kind === "fig" ? `<button class="btn" id="names" style="margin-right:auto" aria-pressed="false">Mostrar nombres</button>` : `<span class="kbd">${q.t === "mc" ? "Teclas A–D y Enter" : q.t === "tf" ? "Teclas V / F y Enter" : q.t === "rtext" ? "" : "Enter para comprobar"}</span>`}
      <button class="btn primary" id="act">Comprobar</button></div>
  </article>`;
  drawFig(v);
  wireQuestion(v);
  $$(".modes button[data-rmode]").forEach(b => b.onclick = () => {
    const m = b.dataset.rmode; if (S.checked || m === rulesMode && (m === "write") === (q.t === "rtext")) return;
    rulesMode = m; S.views[S.i] = prepare(m === "write" ? buildRulesTextQuestion() : buildRulesQuestion(), S.kind); renderQuestion();
  });
  $$(".modes button[data-mode]").forEach(b => b.onclick = () => {
    if (S.checked || v.mode === b.dataset.mode) return;
    v.mode = figMode = b.dataset.mode; v.choices = {}; renderQuestion();
  });
  const nb = $("#names");
  if (nb) nb.onclick = () => {
    const lg = $("#legend"), show = lg.hidden;
    lg.hidden = !show; nb.textContent = show ? "Ocultar nombres" : "Mostrar nombres"; nb.setAttribute("aria-pressed", String(show));
  };
  const first = $("#qwrap input, #qwrap select");
  if (first && window.matchMedia("(pointer:fine)").matches) first.focus({ preventScroll: true });
}

function drawFig(v) {
  const q = v.q;
  if (q.t === "label") { const box = $("#fig"); if (box) box.innerHTML = figSVG(q.fig, { k: markScale(FIGS[q.fig].w, box.clientWidth), status: v.g && v.g.st }); }
  if (q.fig === "right") { const box = $("#figr"); if (box) box.innerHTML = rightSVG(markScale(882, box.clientWidth)); }
}
let rsz;
window.addEventListener("resize", () => { clearTimeout(rsz); rsz = setTimeout(() => { if (S && !S.done && S.views[S.i]) drawFig(S.views[S.i]); }, 150); });

function orderItem(q, k) {
  return `<li class="oitem" data-k="${k}"><span class="pos"></span><span class="txt">${esc(q.items[k])}</span>
    <span class="tools"><button type="button" class="up" aria-label="Subir">▲</button><button type="button" class="dn" aria-label="Bajar">▼</button><button type="button" class="handle" aria-label="Arrastrar">⠿</button></span></li>`;
}

function wireQuestion(v) {
  const q = v.q, act = $("#act");
  if (q.t === "mc" || q.t === "tf") {
    act.disabled = true;
    $$(".opt").forEach(b => b.onclick = () => {
      if (S.checked) return;
      $$(".opt").forEach(x => x.setAttribute("aria-pressed", "false"));
      b.setAttribute("aria-pressed", "true");
      v.sel = q.t === "mc" ? +b.dataset.k : b.dataset.v === "1";
      act.disabled = false;
    });
  }
  if (q.t === "order") wireOrder(v);
  act.onclick = () => (S.checked ? next() : check());
}

function wireOrder(v) {
  const list = $("#olist");
  const sync = () => {
    v.arr = $$(".oitem", list).map(li => +li.dataset.k);
    $$(".oitem", list).forEach((li, i) => {
      li.querySelector(".pos").textContent = i + 1;
      li.querySelector(".up").disabled = i === 0;
      li.querySelector(".dn").disabled = i === v.arr.length - 1;
    });
  };
  sync();
  list.addEventListener("click", e => {
    if (S.checked) return;
    const li = e.target.closest(".oitem"); if (!li) return;
    if (e.target.closest(".up") && li.previousElementSibling) { list.insertBefore(li, li.previousElementSibling); sync(); e.target.closest(".up").focus(); }
    if (e.target.closest(".dn") && li.nextElementSibling) { list.insertBefore(li.nextElementSibling, li); sync(); e.target.closest(".dn").focus(); }
  });
  let drag = null;
  list.addEventListener("pointerdown", e => {
    const h = e.target.closest(".handle"); if (!h || S.checked) return;
    const li = h.closest(".oitem"); e.preventDefault();
    drag = { li, startY: e.clientY, top: li.offsetTop, id: e.pointerId };
    li.classList.add("dragging"); h.setPointerCapture(e.pointerId);
  });
  list.addEventListener("pointermove", e => {
    if (!drag || e.pointerId !== drag.id) return;
    const li = drag.li;
    const sibs = $$(".oitem", list).filter(x => x !== li);
    let before = null;
    for (const s of sibs) { const r = s.getBoundingClientRect(); if (e.clientY < r.top + r.height / 2) { before = s; break; } }
    const cur = li.nextElementSibling === before || (before === null && li === list.lastElementChild);
    if (!cur) {
      const t0 = li.offsetTop;
      list.insertBefore(li, before);
      drag.startY += li.offsetTop - t0;
      sync();
    }
    li.style.transform = `translateY(${e.clientY - drag.startY}px)`;
  });
  const end = () => { if (!drag) return; drag.li.style.transform = ""; drag.li.classList.remove("dragging"); drag = null; sync(); };
  list.addEventListener("pointerup", end);
  list.addEventListener("pointercancel", end);
}

/* ---------- Corrección ---------- */
function grade(v) {
  const q = v.q;
  if (q.t === "mc") return { score: v.sel === 0 ? 1 : 0 };
  if (q.t === "tf") return { score: v.sel === q.a ? 1 : 0 };
  if (q.t === "order") { const pos = v.arr.map((k, i) => k === i); return { score: pos.every(Boolean) ? 1 : 0, pos, nOk: pos.filter(Boolean).length }; }
  if (q.t === "label") {
    const F = FIGS[q.fig]; const st = {};
    F.targets.forEach(t => { st[t.n] = (v.mode === "write" ? nameMatches(t.name, v.choices[t.n]) : (v.choices[t.n] || "") === t.name) ? "ok" : "bad"; });
    const ok = Object.values(st).filter(x => x === "ok").length;
    return { score: ok / F.targets.length, st, ok, total: F.targets.length };
  }
  if (q.t === "rtext") {
    const per = q.rules.map((r, i) => {
      const exp = ruleWords(r); let typ = ruleWords(v.texts[i] || "");
      if (typ.length && typ[0] !== exp[0]) typ.unshift(exp[0]);
      const m = lcsMatch(exp, typ);
      const sc = typ.length ? m.len / Math.max(exp.length, typ.length) : 0;
      return { score: sc, hit: m.hit, exact: m.len === exp.length && typ.length === exp.length };
    });
    const score = per.reduce((a, p) => a + (p.exact ? 1 : p.score), 0) / per.length;
    return { score: per.every(p => p.exact) ? 1 : Math.min(score, 0.99), per };
  }
  if (q.t === "fill") {
    const B = v.parsed.blanks, vals = v.vals;
    const res = B.map(() => ({ ok: false, show: null }));
    const groups = q.anyOrder || [];
    const inGroup = new Set(groups.flat());
    B.forEach((alts, i) => {
      if (inGroup.has(i)) return;
      const ok = alts.some(a => norm(a) === norm(vals[i] || "")) && (vals[i] || "").trim() !== "";
      res[i] = { ok, show: alts[0] };
    });
    groups.forEach(g => {
      const free = new Set(g);
      g.forEach(i => {
        const val = norm(vals[i] || "");
        const m = [...free].find(j => val && B[j].some(a => norm(a) === val));
        if (m != null) { free.delete(m); res[i] = { ok: true, show: B[m][0] }; }
      });
      const left = [...free];
      g.forEach(i => { if (!res[i].ok) res[i] = { ok: false, show: B[left.shift()][0] }; });
    });
    const ok = res.filter(r => r.ok).length;
    return { score: ok / B.length, res, ok, total: B.length };
  }
}

function check() {
  const v = S.views[S.i], q = v.q;
  if (q.t === "fill") v.vals = v.parsed.blanks.map((_, i) => $(`#b-${S.i}-${i}`).value);
  if (q.t === "rtext") v.texts = q.rules.map((_, i) => $(`#rt-${S.i}-${i}`).value);
  if (q.t === "label") FIGS[q.fig].targets.forEach(t => { v.choices[t.n] = $(`#sel-${S.i}-${t.n}`).value; });
  if ((q.t === "mc" || q.t === "tf") && v.sel == null) return;
  const g = grade(v); v.g = g; S.res[S.i] = g.score; S.checked = true;
  showFeedback(v, g);
  const act = $("#act");
  act.textContent = S.i === S.views.length - 1 ? "Ver resultados" : "Siguiente";
  act.disabled = false; act.focus({ preventScroll: true });
  $("#progbar").style.width = `${((S.i + 1) / S.views.length) * 100}%`;
}

function showFeedback(v, g) {
  const q = v.q, fb = $("#fb");
  const cls = g.score === 1 ? "ok" : g.score === 0 ? "bad" : "part";
  let verdict = g.score === 1 ? "Correcto" : g.score === 0 ? "Incorrecto" : "Parcialmente correcto";
  let extra = "";
  if (q.t === "mc") {
    $$(".opt").forEach(b => { b.disabled = true; const k = +b.dataset.k; if (k === 0) b.classList.add("ok"); else if (k === v.sel) b.classList.add("bad"); });
    if (g.score === 0) extra = `<p class="right">Respuesta correcta: ${esc(q.o[0])}</p>`;
  } else if (q.t === "tf") {
    $$(".opt").forEach(b => { b.disabled = true; const val = b.dataset.v === "1"; if (val === q.a) b.classList.add("ok"); else if (val === v.sel) b.classList.add("bad"); });
    extra = `<p class="right">La afirmación es ${q.a ? "VERDADERA" : "FALSA"}.</p>`;
  } else if (q.t === "fill") {
    verdict += g.score < 1 && g.score > 0 ? ` · ${g.ok} de ${g.total}` : "";
    g.res.forEach((r, i) => {
      const inp = $(`#b-${S.i}-${i}`); inp.readOnly = true; inp.classList.add(r.ok ? "ok" : "bad");
      const typed = (v.vals[i] || "").trim();
      let note = "";
      if (!r.ok) note = `<span class="fix bad">${esc(r.show)}</span>`;
      else if (typed !== r.show) note = `<span class="fix ok">se escribe: ${esc(r.show)}</span>`;
      if (note) inp.insertAdjacentHTML("afterend", note);
    });
  } else if (q.t === "order") {
    const list = $("#olist"); list.classList.add("locked");
    $$(".oitem", list).forEach((li, i) => {
      const k = +li.dataset.k; li.classList.add(k === i ? "ok" : "bad");
      if (k !== i) li.querySelector(".txt").insertAdjacentHTML("beforeend", `<small>Va en el lugar ${k + 1}</small>`);
    });
    if (g.score === 0) { verdict += ` · ${g.nOk} de ${q.items.length} en su lugar`; extra = `<p class="right">Orden correcto:</p><ol>${q.items.map(t => `<li>${esc(t)}</li>`).join("")}</ol>`; }
  } else if (q.t === "rtext") {
    if (g.score > 0 && g.score < 1) verdict += ` · ${Math.round(g.score * 100)} %`;
    q.rules.forEach((r, i) => {
      const p = g.per[i], box = $(`.rt[data-i="${i}"]`), ta = $(`#rt-${S.i}-${i}`);
      ta.readOnly = true; box.classList.add(p.exact ? "ok" : p.score >= .5 ? "part" : "bad");
      let k = 0;
      const shown = r.split(/([A-Za-zÁÉÍÓÚáéíóúÑñÜü0-9]+)/).map(tok => /^[A-Za-zÁÉÍÓÚáéíóúÑñÜü0-9]+$/.test(tok) ? (p.hit[k++] ? esc(tok) : `<mark class="miss">${esc(tok)}</mark>`) : esc(tok)).join("");
      box.insertAdjacentHTML("beforeend", `<p class="rtres"><span class="lbl">${p.exact ? "Correcta" : `Regla ${i + 1} · ${Math.round(p.score * 100)} %`}</span>${shown}</p>`);
    });
  } else if (q.t === "label") {
    verdict += g.score < 1 && g.score > 0 ? ` · ${g.ok} de ${g.total}` : "";
    drawFig(v);
    FIGS[q.fig].targets.forEach(t => {
      const row = $(`.lrow[data-n="${t.n}"]`), sel = $(`#sel-${S.i}-${t.n}`);
      if (v.mode === "write") sel.readOnly = true; else sel.disabled = true;
      row.classList.add(g.st[t.n]);
      if (g.st[t.n] === "bad") sel.insertAdjacentHTML("afterend", `<span class="fix bad">Correcto: ${esc(t.name)}</span>`);
      else if (v.mode === "write" && (v.choices[t.n] || "").trim() !== t.name) sel.insertAdjacentHTML("afterend", `<span class="fix ok">Nombre: ${esc(t.name)}</span>`);
    });
  }
  fb.className = `fb ${cls}`;
  fb.innerHTML = `<p class="verdict">${verdict}</p>${extra}<p>${esc(q.exp)}</p>${exBox(q)}<p class="src">Fuente: ${esc(srcLine(q))}</p>`;
  fb.hidden = false;
  if (window.innerWidth < 700) fb.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function next() {
  if (S.i < S.views.length - 1) { S.i++; renderQuestion(); window.scrollTo({ top: 0 }); }
  else finish();
}

/* ---------- Resultados ---------- */
function finish() {
  if (S.done) return;
  S.done = true; clearInterval(timerId);
  S.elapsed = Date.now() - S.t0;
  S.views.forEach((v, i) => { if (S.res[i] == null) { S.res[i] = 0; v.skipped = true; } });
  const pts = S.res.reduce((a, b) => a + b, 0), n = S.views.length;
  const pct = Math.round((pts / n) * 100);
  if (S.kind === "unit" || S.kind === "final") store.set(S.id, pct);
  renderResults(pts, n, pct);
}

function targetSVG(pct, pass) {
  const col = pass ? "var(--ok)" : "var(--bad)";
  const r = 70, c = 2 * Math.PI * r;
  return `<svg viewBox="0 0 170 170" aria-hidden="true">
    ${[78, 60, 42, 24].map((rr, i) => `<circle cx="85" cy="85" r="${rr}" fill="${i % 2 ? "var(--surface-2)" : "var(--surface)"}" stroke="var(--line)" stroke-width="1.5"/>`).join("")}
    <circle cx="85" cy="85" r="${r}" fill="none" stroke="var(--line)" stroke-width="10" opacity=".5"/>
    <circle cx="85" cy="85" r="${r}" fill="none" stroke="${col}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${(c * pct / 100).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 85 85)"/>
    <text x="85" y="82" text-anchor="middle" font-family="var(--f-display)" font-weight="700" font-size="44" fill="var(--ink)">${pct}%</text>
    <text x="85" y="108" text-anchor="middle" font-family="var(--f-mono)" font-size="11" fill="var(--muted)">MÍNIMO ${PASS}%</text>
  </svg>`;
}

function answerSummary(v) {
  const q = v.q, g = v.g;
  if (v.skipped) return `<div><span class="lbl">Tu respuesta</span><span class="wrongtxt">Sin responder</span></div>` + correctSummary(q);
  if (q.t === "mc") return `<div><span class="lbl">Tu respuesta</span><span class="${v.sel === 0 ? "righttxt" : "wrongtxt"}">${esc(q.o[v.sel])}</span></div>` + (v.sel === 0 ? "" : correctSummary(q));
  if (q.t === "tf") return `<div><span class="lbl">Tu respuesta</span><span class="${v.sel === q.a ? "righttxt" : "wrongtxt"}">${v.sel ? "Verdadero" : "Falso"}</span></div>` + (v.sel === q.a ? "" : correctSummary(q));
  if (q.t === "fill") return g.res.map((r, i) => `<div><span class="lbl">Espacio ${i + 1}</span>${r.ok ? `<span class="righttxt">${esc(r.show)}</span>` : `<span class="wrongtxt">${esc((v.vals[i] || "").trim() || "—")}</span> → <span class="righttxt">${esc(r.show)}</span>`}</div>`).join("");
  if (q.t === "order") return g.score === 1 ? `<div><span class="lbl">Orden</span><span class="righttxt">Correcto</span></div>` : `<div><span class="lbl">Tu orden</span>${v.arr.map((k, i) => `<span class="${k === i ? "righttxt" : "wrongtxt"}">${i + 1}. ${esc(q.items[k])}</span>`).join(" · ")}</div>` + correctSummary(q);
  if (q.t === "rtext") return q.rules.map((r, i) => `<div><span class="lbl">Regla ${i + 1}</span>${g.per[i].exact ? `<span class="righttxt">Correcta</span>` : `<span class="wrongtxt">${Math.round(g.per[i].score * 100)} % · ${esc((v.texts[i] || "").trim() || "—")}</span><br><span class="righttxt">${esc(r)}</span>`}</div>`).join("");
  if (q.t === "label") return FIGS[q.fig].targets.slice().sort((a, b) => a.n - b.n).map(t => {
    const c = v.choices[t.n] || "";
    return `<div><span class="lbl">N.° ${t.n}</span>${g.st[t.n] === "ok" ? `<span class="righttxt">${esc(t.name)}</span>` : `<span class="wrongtxt">${esc(c || "—")}</span> → <span class="righttxt">${esc(t.name)}</span>`}</div>`;
  }).join("");
}
function correctSummary(q) {
  if (q.t === "mc") return `<div><span class="lbl">Correcta</span><span class="righttxt">${esc(q.o[0])}</span></div>`;
  if (q.t === "tf") return `<div><span class="lbl">Correcta</span><span class="righttxt">${q.a ? "Verdadero" : "Falso"}</span></div>`;
  if (q.t === "order") return `<div><span class="lbl">Correcto</span>${q.items.map((t, i) => `${i + 1}. ${esc(t)}`).join(" · ")}</div>`;
  if (q.t === "fill") return `<div><span class="lbl">Correcto</span>${parseFill(q.text).blanks.map(b => `<span class="righttxt">${esc(b[0])}</span>`).join(" · ")}</div>`;
  if (q.t === "rtext") return q.rules.map((r, i) => `<div><span class="lbl">Regla ${i + 1}</span>${esc(r)}</div>`).join("");
  if (q.t === "label") return `<div><span class="lbl">Correcto</span>${FIGS[q.fig].targets.slice().sort((a, b) => a.n - b.n).map(t => `${t.n}. ${esc(t.name)}`).join(" · ")}</div>`;
  return "";
}

function renderResults(pts, n, pct) {
  app().classList.remove("wide");
  const pass = pct >= PASS;
  const ok = S.res.filter(x => x === 1).length, bad = S.res.filter(x => x === 0).length, part = n - ok - bad;
  const byType = {}, byUnit = {};
  S.views.forEach((v, i) => {
    const t = v.q.t; (byType[t] = byType[t] || { n: 0, p: 0 }); byType[t].n++; byType[t].p += S.res[i];
    const u = v.q.uid; (byUnit[u] = byUnit[u] || { n: 0, p: 0 }); byUnit[u].n++; byUnit[u].p += S.res[i];
  });
  const row = (label, o) => { const p = Math.round(o.p / o.n * 100); return `<tr><td>${label}</td><td class="n">${fmtNum(o.p)} / ${o.n}</td><td class="n">${p} %</td><td style="width:35%"><span class="bar"><i style="width:${p}%;background:${p >= PASS ? "var(--ok)" : "var(--bad)"}"></i></span></td></tr>`; };
  const typeRows = Object.keys(TYPE_LABEL).filter(t => byType[t]).map(t => row(TYPE_LABEL[t], byType[t])).join("");
  const unitRows = Object.keys(byUnit).length > 1 && S.subj ? SUBJECTS[S.subj].units.filter(u => byUnit[u.id]).map(u => row(`${esc(u.short)} · ${esc(u.title)}`, byUnit[u.id])).join("") : "";
  const wrong = S.views.filter((v, i) => S.res[i] < 1);
  app().innerHTML = `
  <div class="qbar"><div class="wrap" style="grid-template-columns:1fr auto">
    <div class="ttl">${esc(S.title)}<small>Resultados</small></div>
    <button class="btn" id="home2">Inicio</button>
  </div></div>
  <main class="res"><div class="wrap">
    <section class="score">
      ${targetSVG(pct, pass)}
      <div>
        <h2>${esc(S.title)}</h2>
        <div class="stamp ${pass ? "pass" : "fail"}">${pass ? "Aprobado" : "No aprobado"}</div>
        <div class="stats"><span>${fmtNum(pts)} de ${n} puntos</span><span class="o">${ok} ${ok === 1 ? "correcta" : "correctas"}</span>${part ? `<span class="p">${part} ${part === 1 ? "parcial" : "parciales"}</span>` : ""}<span class="x">${bad} ${bad === 1 ? "incorrecta" : "incorrectas"}</span><span>Tiempo ${fmtTime(S.elapsed)}</span></div>
        ${S.timeout ? `<p class="timeout">Se terminó el tiempo: las preguntas sin responder cuentan como incorrectas.</p>` : ""}
      </div>
    </section>
    <div class="racts">
      ${wrong.length ? `<button class="btn primary" id="retry-wrong">Practicar solo los errores (${wrong.length})</button>` : ""}
      <button class="btn" id="again">${S.kind === "final" ? "Otro examen final" : "Repetir"}</button>
      <button class="btn ghost" id="home3">Volver al inicio</button>
    </div>
    ${unitRows ? `<section style="display:grid;gap:10px"><h2 class="sec-title">Por unidad</h2><div class="tbl-wrap"><table><thead><tr><th>Unidad</th><th style="text-align:right">Puntos</th><th style="text-align:right">%</th><th></th></tr></thead><tbody>${unitRows}</tbody></table></div></section>` : ""}
    <section style="display:grid;gap:10px"><h2 class="sec-title">Por tipo de pregunta</h2>
      <div class="tbl-wrap"><table><thead><tr><th>Tipo</th><th style="text-align:right">Puntos</th><th style="text-align:right">%</th><th></th></tr></thead><tbody>${typeRows}</tbody></table></div></section>
    <section style="display:grid;gap:12px">
      <h2 class="sec-title">Resumen de respuestas</h2>
      <div class="tabs" role="tablist">
        <button role="tab" id="tab-err" aria-selected="${wrong.length ? "true" : "false"}">Errores (${wrong.length})</button>
        <button role="tab" id="tab-all" aria-selected="${wrong.length ? "false" : "true"}">Todas (${n})</button>
      </div>
      <div class="review" id="review"></div>
    </section>
  </div></main>`;
  const draw = onlyErr => {
    const items = S.views.map((v, i) => ({ v, i, s: S.res[i] })).filter(x => !onlyErr || x.s < 1);
    $("#review").innerHTML = items.length ? items.map(({ v, i, s }) => `
      <article class="ritem ${s === 1 ? "" : s === 0 ? "bad" : "part"}">
        <div class="top"><span class="qnum">${i + 1}. ${s === 1 ? "Correcta" : s === 0 ? "Incorrecta" : `Parcial (${Math.round(s * 100)} %)`}</span><span class="chip">${TYPE_LABEL[v.q.t]}</span></div>
        <h4>${esc(v.q.q)}</h4>
        ${v.q.t === "fill" ? `<p class="why" style="color:var(--ink)">${esc(v.q.text.replace(/\{\{(.*?)\}\}/g, (m, a) => "____"))}</p>` : ""}
        <div class="ans">${answerSummary(v)}</div>
        <p class="why">${esc(v.q.exp)} <span style="font-family:var(--f-mono);font-size:12px">· ${esc(srcLine(v.q))}</span></p>
        ${exBox(v.q, "ex ex-sm")}
      </article>`).join("") : `<p class="empty">No hubo errores. ¡Muy bien!</p>`;
  };
  const setTab = onlyErr => { $("#tab-err").setAttribute("aria-selected", onlyErr); $("#tab-all").setAttribute("aria-selected", !onlyErr); draw(onlyErr); };
  $("#tab-err").onclick = () => setTab(true);
  $("#tab-all").onclick = () => setTab(false);
  setTab(wrong.length > 0);
  $("#home2").onclick = renderHome; $("#home3").onclick = renderHome;
  const prev = { kind: S.kind, id: S.id, title: S.title, figKey: S.figKey, deck: S.deck };
  $("#again").onclick = () => prev.kind === "final" ? startQuiz("final", { timed: S.limit > 0 }) : prev.kind === "unit" ? startQuiz("unit", prev.id) : prev.kind === "fig" ? startQuiz("fig", prev.figKey) : prev.kind === "rules" ? startQuiz("rules") : prev.kind === "deck" ? startQuiz("deck", prev.deck) : startQuiz("retry", { id: prev.id, title: prev.title, qs: S.views.map(v => v.q) });
  if (wrong.length) $("#retry-wrong").onclick = () => startQuiz("retry", { id: prev.id, title: prev.title, qs: wrong.map(v => v.q) });
  window.scrollTo(0, 0);
}

/* ---------- Teclado ---------- */
document.addEventListener("keydown", e => {
  if (!S || S.done || e.altKey || e.ctrlKey || e.metaKey) return;
  const v = S.views[S.i]; if (!v) return;
  const t = e.target, typing = t && (t.tagName === "INPUT" || t.tagName === "SELECT");
  if (e.key === "Enter" && t && t.tagName === "TEXTAREA") return;
  if (e.key === "Enter") {
    if (t && t.tagName === "BUTTON" && !t.id.startsWith("opt-")) return;
    e.preventDefault(); const act = $("#act"); if (act && !act.disabled) act.click(); return;
  }
  if (typing || S.checked) return;
  const k = e.key.toLowerCase();
  if (v.q.t === "mc" && "abcd".includes(k) && k.length === 1) { const b = $(`#opt-${"abcd".indexOf(k)}`); if (b) b.click(); }
  if (v.q.t === "tf" && (k === "v" || k === "f")) $(k === "v" ? "#opt-v" : "#opt-f").click();
});

renderHome();

</script>
</body>
</html>
